<!--
  Expected <head> tags when someone shares a look / Ask card: {ORIGIN}/ask/{token}
  Source: src/app/ask/[token]/page.tsx generateMetadata()
  Image: try-on photo via /api/ask/{token}/image (also served at /ask/{token}/opengraph-image)
  Replace {ORIGIN}, {token}, {asker} (first name, fallback "they").
  robots.txt disallows /ask/ — crawlers that honor robots may not fetch this page.
-->
<html lang="en">
<head>
  <title>Should {asker} get it? · Shoop</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />

  <meta name="description" content="Vote before you peek at Shoop’s verdict." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />

  <link rel="canonical" href="{ORIGIN}/ask/{token}" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/shoop-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/shoop-icon.svg" type="image/svg+xml" />

  <!-- Open Graph — look photo, not the brand card -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Shoop" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Should {asker} get it? · Shoop" />
  <meta property="og:description" content="Vote before you peek at Shoop’s verdict." />
  <meta property="og:url" content="{ORIGIN}/ask/{token}" />
  <meta property="og:image" content="{ORIGIN}/api/ask/{token}/image" />
  <meta property="og:image:alt" content="{asker}'s try-on look" />
  <!-- Next.js file convention also exposes: -->
  <meta property="og:image" content="{ORIGIN}/ask/{token}/opengraph-image" />
  <meta property="og:image:alt" content="The look — should they get it?" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Should {asker} get it? · Shoop" />
  <meta name="twitter:description" content="Vote before you peek at Shoop’s verdict." />
  <meta name="twitter:image" content="{ORIGIN}/api/ask/{token}/image" />

  <!-- Instagram / WhatsApp / iMessage thumbnail = og:image (the look photo). No 1080×1080 square crop. -->
</head>
</html>
