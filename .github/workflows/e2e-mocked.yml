name: E2E Mocked (PR)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:fashion-prompts
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-mocked
          path: e2e-report.json
          retention-days: 14
